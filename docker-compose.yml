services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5433:5432"]
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      retries: 10

  ingest:
    build: .
    command: python src/pipeline.py --source sample_docs --dsn postgresql://rag:rag@postgres:5432/rag
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: .
    command: uvicorn api:app --app-dir src --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      PG_DSN: postgresql://rag:rag@postgres:5432/rag
    depends_on:
      postgres: {condition: service_healthy}
